{% extends "base.html" %}
{% block content %}
<div class="container pt-80 pb-80">
  <h2>Upload Resume for AI Verification</h2>
  <p>Supported formats: PDF, DOCX, TXT. Our AI checks for consistency, exaggeration and red flags instantly.</p>
  <form method="post" enctype="multipart/form-data" style="max-width:500px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="apply-btn">Upload &amp; Verify</button>
  </form>
</div>
{% endblock %}
